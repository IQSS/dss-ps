project:
  type: dss-theme-book

book:
  title: "Matching and Weighting for Causal Inference: A Primer and Tutorial"
  author: "Noah Greifer"
  date: "last-modified"
  repo-url: https://github.com/IQSS/dss-ps/
  site-url: https://iqss.github.io/dss-ps/
  repo-actions: [issue]
  page-navigation: true
  # The theme contributes the footer's left half; the licence is this book's own.
  page-footer:
    right:
      - text: "CC BY-SA 4.0"
        href: https://github.com/IQSS/dss-ps/blob/main/LICENSE
  search: true
  chapters:
    - index.qmd

    - intro.qmd
    - planning.qmd

    - part: "Running the Analysis"
      chapters:
        - running.qmd
        - conceptual.qmd
        - conditioning.qmd
        - assessing.qmd
        - respecification.qmd
        - estimating.qmd
        - sensitivity.qmd
        - advanced.qmd
    - reporting.qmd
    - part: "Example"
      chapters:
        - example.qmd
        - ex-match.qmd
        - ex-weight.qmd
    - conclusion.qmd
    - references.qmd

bibliography: references.bib

format:
  dss-theme-html:
    code-link: true
    author-meta: "Noah Greifer"
    include-in-header:
      # Search Console: the meta tag proves ownership of the URL-prefix property; the token is per Google
      # account, the same on every DSS site. Visitor counts: GoatCounter at dss-ps.goatcounter.com; a page
      # view is recorded with its path, title and referrer, no cookie, nothing that identifies the reader.
      # Adding #toggle-goatcounter to any iqss.github.io address switches counting off in that browser.
      - text: |
          <meta name="google-site-verification" content="yQHSXWQVwOPIg4wRh9A8zusoTpcfgW05SWdbVN0rF-s">
          <script data-goatcounter="https://dss-ps.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

execute:
  freeze: auto
