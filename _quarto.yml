project:
  type: dss-theme-book

book:
  title: "Matching and Weighting for Causal Inference: A Primer and Tutorial"
  author: "Noah Greifer"
  date: "last-modified"
  repo-url: https://github.com/IQSS/dss-ps/
  repo-actions: [issue]
  page-navigation: true
  # The theme contributes the footer's left half; the licence is this book's own.
  page-footer:
    right:
      - text: "CC BY-SA 4.0"
        href: https://github.com/IQSS/dss-ps/blob/main/LICENSE
  search: true
  chapters:
    - index.qmd

    - intro.qmd
    - planning.qmd

    - part: "Running the Analysis"
      chapters:
        - running.qmd
        - conceptual.qmd
        - conditioning.qmd
        - assessing.qmd
        - respecification.qmd
        - estimating.qmd
        - sensitivity.qmd
        - advanced.qmd
    - reporting.qmd
    - part: "Example"
      chapters:
        - example.qmd
        - ex-match.qmd
        - ex-weight.qmd
    - conclusion.qmd
    - references.qmd

bibliography: references.bib

format:
  dss-theme-html:
    code-link: true
    author-meta: "Noah Greifer"

execute:
  freeze: auto
